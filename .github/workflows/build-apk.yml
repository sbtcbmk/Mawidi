name: Build Maw3idi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/20.0/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Firebase config
        shell: bash
        run: |
          mkdir -p app

          if [ ! -f app/google-services.json ]; then
            python3 -c 'import json; data={"project_info":{"project_number":"000000000000","project_id":"maw3idi-build","storage_bucket":"maw3idi-build.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.maw3idi.app"}},"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly"}]}],"configuration_version":"1"}; open("app/google-services.json","w").write(json.dumps(data, indent=2))'

          fi

          echo "Firebase config prepared successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build APK
        shell: bash
        run: |
          set +e

          gradle assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "       IMPORTANT BUILD INFORMATION"
          echo "========================================"

          echo ""
          echo "===== GRADLE VERSION ====="
          gradle --version | head -20

          echo ""
          echo "===== FAILURE SECTION ====="
          grep -n -B 30 -A 100 "What went wrong:" build.log | tail -150 || true

          echo ""
          echo "===== EXCEPTION SECTION ====="
          grep -n -B 10 -A 30 \
            "Exception\|Caused by:\|AAPT\|Manifest merger failed\|Duplicate class\|resource .* not found" \
            build.log | tail -200 || true

          echo ""
          echo "===== LAST 200 LINES ====="
          tail -200 build.log || true

          echo ""
          echo "===== GRADLE EXIT CODE ====="
          echo "$EXIT_CODE"

          exit "$EXIT_CODE"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Maw3idi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
